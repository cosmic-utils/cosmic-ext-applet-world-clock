[package]
name = "cosmic-ext-applet-world-clock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
authors = ["rwxroot <rwxroot@proton.me>"]

[dependencies]
i18n-embed = { version = "0.16.0", default-features = false, features = [
	"rust-embed",
	"fluent-system",
	"desktop-requester",
] }
i18n-embed-fl = { version = "0.10.1", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = [
	"std",
	"tz-system",
] }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
	"applet",
] }
rust-embed = { version = "8.12.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
tracing = { version = "0.1.44", default-features = false, features = ["log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
	"ansi",
	"env-filter",
] }
